# keyd: Linux keyboard remapping daemon, the counterpart of the Karabiner
# Elements config on macOS
#
# applied to all keyboards:
#   - Caps Lock  -> Escape
#   - Right Alt  -> Control (held modifier)
#   - grave/tilde <-> non-US backslash (102nd), UK/ISO layout swap
#
# a keyd config file may contain only ONE [ids] section. per-device overrides
# go in a separate file under /etc/keyd/ (keyd applies the most specific match)
#
# reload: sudo keyd reload   (binary is keyd.rvaiya on Debian/Raspberry Pi OS)
# test:   sudo keyd monitor

[ids]

*

[main]

capslock = escape
rightalt = layer(control)
` = 102nd
102nd = `
