# every path the installer manages. read by scripts/_lib/manifest.sh
#
# kind: link (symlink into the repo), copy (copied once, then user-owned),
#   local (override created from a template), link-generated (symlink to a
#   file theme-switch writes; created after theme generation), sync (local
#   layer only, never installed)
# preset: minimal, core or full. os: any, macos or linux
# source and dest: repo-relative, or outside the repo when starting ~/, $cfg/
#   ($XDG_CONFIG_HOME) or $appsupport/ (~/Library/Application Support)
# local: path inside the private local-layer repo; omit when not synced
#
# [Name] starts a group. fields are separated by whitespace, so no field
# contains a space; - fills an unused source
#
# kind          preset   os     source                            dest                                    local
[Zsh]
local           minimal  any    zsh/zshrc.template                ~/.zshrc                                zshrc
link            minimal  any    zsh/zprofile                      ~/.zprofile

[Tmux]
link            minimal  any    tmux                              ~/.tmux
local           minimal  any    tmux/local.conf.template          $cfg/tmux/local.conf                    config/tmux/local.conf
link-generated  minimal  any    $cfg/tmux/tmux.conf               ~/.tmux.conf

[Dotfiles CLI]
link            minimal  any    scripts/dotfiles                  ~/.local/bin/dotfiles

[Formatters]
link            minimal  any    formatters/prettierrc.json        ~/.prettierrc
link            minimal  any    formatters/editorconfig           ~/.editorconfig

[Neovim]
link            core     any    nvim                              $cfg/nvim
local           core     any    nvim/local.lua.template           $cfg/nvim/local.lua                     config/nvim/local.lua

[Hammerspoon]
link            full     any    hammerspoon/init.lua              ~/.hammerspoon/init.lua
local           full     any    hammerspoon/local.lua.template    ~/.hammerspoon/local.lua                hammerspoon/local.lua

[Ghostty]
local           core     any    ghostty/local.template            $cfg/ghostty/local                      config/ghostty/local

[Zed]
link            core     any    zed/keymap.json                   $cfg/zed/keymap.json
link            core     any    zed/tasks.json                    $cfg/zed/tasks.json
copy            core     any    zed/settings.json                 $cfg/zed/settings.json                  config/zed/settings.json

[Karabiner]
copy            full     any    karabiner/karabiner.json          $cfg/karabiner/karabiner.json           config/karabiner/karabiner.json

[gh-dash]
local           core     any    gh-dash/local.yml.template        $cfg/gh-dash/local.yml                  config/gh-dash/local.yml
link            core     any    gh-dash/dash-repo-sync            ~/.local/bin/dash-repo-sync

[btop]
copy            core     any    btop/btop.conf                    $cfg/btop/btop.conf                     config/btop/btop.conf

[Yazi]
link            core     any    yazi/yazi.toml                    $cfg/yazi/yazi.toml
link            core     any    yazi/keymap.toml                  $cfg/yazi/keymap.toml

[Launchers]
link            core     any    launchers/dev                     ~/.local/launchers/dev

[LazyGit]
link            core     any    lazygit/config.yml                $cfg/lazygit/config.yml
local           core     any    lazygit/local.yml.template        $cfg/lazygit/local.yml                  config/lazygit/local.yml

[LazyDocker]
copy            core     macos  lazydocker/config.yml             $appsupport/lazydocker/config.yml       lazydocker/config.yml
copy            core     linux  lazydocker/config.yml             $cfg/lazydocker/config.yml              lazydocker/config.yml
link            core     macos  lazydocker/format-logs.awk        $appsupport/lazydocker/format-logs.awk
link            core     linux  lazydocker/format-logs.awk        $cfg/lazydocker/format-logs.awk

[ImageMagick font map]
link            core     macos  imagemagick/type.xml              $cfg/ImageMagick/type.xml

[Statusline theme resolver]
link            core     any    scripts/_lib/statusline-theme.sh  $cfg/dotfiles/statusline-theme.sh

[Local layer]
sync            core     any    -                                 ~/.ai/claude/CLAUDE.local.md            ai/claude/CLAUDE.local.md
sync            core     any    -                                 $cfg/dotfiles/launchers/                config/dotfiles/launchers
