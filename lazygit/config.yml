# lazygit base configuration
# managed by dotfiles: symlinked from ~/dotfiles/lazygit/config.yml
# personal overrides go in local.yml (same directory), loaded via LG_CONFIG_FILE

gui:
  nerdFontsVersion: "3"
  theme:
    # reverse video for selections: works with any terminal colour scheme and
    # avoids poor contrast from ANSI colours used as backgrounds
    selectedLineBgColor:
      - reverse

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never
