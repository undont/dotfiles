auto_resume = ["nvim", "btop", "dash", "jiru", "claude", "pi", "opencode", "codex"]

[programs.btop]
resume = "btop"

[programs.dash]
match = ["gh"]
resume = "gh dash"

[programs.jiru]
resume = "jiru"

[programs.pi]
state = "id"
resume = "pi --session-id {state}"

[programs.opencode]
state = "id"
resume = "opencode --session {state}"
