# yazi file manager configuration
# docs: https://yazi-rs.github.io/docs/configuration/yazi

[preview]
# the bundled PDF previewer renders pages with `pdftoppm` (poppler) and
# precaches the image capped to these dimensions. yazi does not upscale past
# the cached size, so the smaller default caps make PDF/image previews look
# small on a large terminal. larger caps cost more cache space
max_width = 1200
max_height = 1800
