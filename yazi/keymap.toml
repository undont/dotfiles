# yazi keymap overrides
# docs: https://yazi-rs.github.io/docs/configuration/keymap

# <Enter> keeps the default open (directories -> $EDITOR); `o` hands the
# selection to the system file explorer (directories open in Finder/Files,
# files with their default app). prepend_keymap shadows the built-in `o`
[[mgr.prepend_keymap]]
on = "o"
run = 'shell -- { command -v xdg-open >/dev/null && xdg-open %s; } || open %s'
desc = "Open in system file explorer"

# lazygit in the current directory; --block hands the terminal over and returns
# to yazi on quit
[[mgr.prepend_keymap]]
on = "<C-g>"
run = 'shell --block -- lazygit'
desc = "lazygit (cwd)"
